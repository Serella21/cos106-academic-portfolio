
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Ayomide Shoyombo</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<header class="site-header">
    <a href="index.html" class="logo">AS<span>.</span></a>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="projects.html">Projects</a>
        <a href="planner.html">Planner</a>
        <a href="contact.html" class="active">Contact</a>
    </nav>
</header>

<main>

    <section class="contact-section">

        <p class="eyebrow">GET IN TOUCH / 2026</p>

        <h1>Let's connect.</h1>

        <p>
            Have a question, an idea or simply want to connect?
            Feel free to send me a message using the form below.
        </p>

        <form class="contact-form" id="contactForm">

            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name"
                       placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email"
                       placeholder="Enter your email address" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter your phone number"
                    inputmode="numeric"
                    pattern="[0-9]*"
                    oninput="this.value = this.value.replace(/[^0-9]/g, '')"
                    required
                >
            </div>

            <div class="form-group">
                <label for="subject">Subject</label>
                <input type="text" id="subject"
                       placeholder="What is your message about?"
                       required>
            </div>

            <div class="form-group">
                <label for="message">Your Message</label>
                <textarea id="message"
                          placeholder="Write your message here..."
                          required></textarea>
            </div>

            <button type="submit" class="btn-primary">
                Send Message
            </button>

            <p id="formMessage" aria-live="polite"></p>

        </form>

    </section>

</main>

<footer class="site-footer">
    <p>© 2026 Ayomide Shoyombo</p>
    <p>COS 106 – Introduction to Web Technologies.</p>
</footer>

<script>

    const contactForm = document.getElementById("contactForm");
    const formMessage = document.getElementById("formMessage");

    contactForm.addEventListener("submit", function(event) {

        event.preventDefault();

        const name = document.getElementById("name").value.trim();
        const email = document.getElementById("email").value.trim();
        const phone = document.getElementById("phone").value.trim();
        const subject = document.getElementById("subject").value.trim();
        const message = document.getElementById("message").value.trim();

        if (!name || !email || !phone || !subject || !message) {
            formMessage.textContent = "Please complete all fields.";
            return;
        }

        formMessage.textContent =
            "Thank you, " + name + "! Your form has been submitted successfully.";

        contactForm.reset();

    });

</script>

<script src="js/script.js"></script>

</body>
</html>
