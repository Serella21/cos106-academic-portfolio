
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academic Planner | Ayomide Shoyombo</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .planner-section {
            padding: 60px 10%;
            max-width: 900px;
        }

        .task-form {
            display: flex;
            gap: 10px;
            margin: 25px 0;
        }

        .task-form input {
            flex: 1;
            padding: 13px;
            border: 1px solid #dedfd7;
            border-radius: 3px;
            font-size: 15px;
        }

        .task-form button {
            background: #174b36;
            color: white;
            border: none;
            padding: 12px 20px;
            cursor: pointer;
            border-radius: 3px;
        }

        .task-list {
            list-style: none;
        }

        .task-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 16px;
            border-bottom: 1px solid #dedfd7;
        }

        .task-list li span {
            flex: 1;
            overflow-wrap: anywhere;
        }

        .task-list li.completed span {
            text-decoration: line-through;
            color: #888;
        }

        .task-list button {
            padding: 6px 10px;
            cursor: pointer;
            border: none;
            border-radius: 3px;
        }

        .delete-btn {
            background: #f3e3dc;
            color: #a33d25;
        }

        .task-list label {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            min-width: 0;
        }

        @media(max-width: 600px) {
            .task-form {
                flex-direction: column;
            }
            .planner-section {
                padding: 40px 7%;
            }
        }
    </style>
</head>
<body>

<header class="site-header">
    <a href="index.html" class="logo">AS<span>.</span></a>
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="projects.html">Projects</a>
        <a href="planner.html" class="active">Planner</a>
        <a href="contact.html">Contact</a>
    </nav>
</header>

<main>
    <section class="planner-section">
        <p class="eyebrow">STAY ORGANised / STAY FOCUSED</p>
        <h1>My Academic Planner</h1>
        <p>Keep track of your learning activities and assignments.</p>

        <form class="task-form" id="taskForm">
            <input type="text" id="taskInput"
                   placeholder="Enter a new task..." required>
            <button type="submit">Add Task +</button>
        </form>

        <h3>My Tasks</h3>
        <ul class="task-list" id="taskList"></ul>
        <p id="emptyMessage">No tasks yet. Add your first task!</p>
    </section>
</main>

<footer class="site-footer">
    <p>© 2026 Ayomide Shoyombo</p>
    <p>COS 106 – Introduction to Web Technologies.</p>
</footer>

<script>
    const taskForm = document.getElementById("taskForm");
    const taskInput = document.getElementById("taskInput");
    const taskList = document.getElementById("taskList");
    const emptyMessage = document.getElementById("emptyMessage");

    let tasks = JSON.parse(localStorage.getItem("academicTasks")) || [];

    function saveTasks() {
        localStorage.setItem("academicTasks", JSON.stringify(tasks));
    }

    function displayTasks() {
        taskList.innerHTML = "";

        emptyMessage.style.display = tasks.length === 0 ? "block" : "none";

        tasks.forEach((task, index) => {
            const li = document.createElement("li");

            if (task.completed) {
                li.classList.add("completed");
            }

            const label = document.createElement("label");
            const checkbox = document.createElement("input");
            checkbox.type = "checkbox";
            checkbox.checked = task.completed;

            checkbox.addEventListener("change", () => {
                tasks[index].completed = checkbox.checked;
                saveTasks();
                displayTasks();
            });

            const span = document.createElement("span");
            span.textContent = task.name;

            label.appendChild(checkbox);
            label.appendChild(span);

            const deleteButton = document.createElement("button");
            deleteButton.textContent = "Delete";
            deleteButton.className = "delete-btn";

            deleteButton.addEventListener("click", () => {
                tasks.splice(index, 1);
                saveTasks();
                displayTasks();
            });

            li.appendChild(label);
            li.appendChild(deleteButton);
            taskList.appendChild(li);
        });
    }

    taskForm.addEventListener("submit", function(event) {
        event.preventDefault();

        const taskName = taskInput.value.trim();

        if (taskName !== "") {
            tasks.push({
                name: taskName,
                completed: false
            });

            saveTasks();
            displayTasks();
            taskInput.value = "";
        }
    });

    displayTasks();
</script>

<script src="js/script.js"></script>

</body>
</html>
